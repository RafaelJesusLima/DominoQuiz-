<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c12">
<meta name="color-scheme" content="dark">
<title>DominoQuiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: phone first, one column. Lookup and settings give way to the ficha while a card is open; the actions sit in a bottom dock within thumb reach. */
:root {
  --ink: #0a0c12;
  --ink-2: #12151f;
  --line: #2c3347;
  --paper: #ffffff;
  --paper-dim: #aeb6cc;
  --paper-ink: #0a0c12;
  --paper-ink-2: #3d4560;
  --paper-track: #dde2ee;
  --blue: #2457f5;
  --blue-hover: #3d6cff;
  --blue-soft: #e6ecff;
  --red: #e5222b;
  --red-deep: #c01820;
  --red-soft: #ff7b82;
  --font-display: 'Bricolage Grotesque', 'Arial Black', system-ui, sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --dock-h: 92px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { background: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.playing { padding-bottom: calc(var(--dock-h) + 24px + env(safe-area-inset-bottom, 0px)); }
button, input, label { touch-action: manipulation; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

.brand { display: flex; align-items: center; gap: 14px; }
.mark {
  flex: none; width: 40px; height: 58px; border-radius: 8px;
  background: var(--paper); color: var(--red);
  display: grid; place-items: center;
  font: 800 2.2rem/1 var(--font-display);
}
h1 { margin: 0; font: 800 clamp(1.9rem, 9vw, 2.6rem)/1 var(--font-display); letter-spacing: -0.02em; }
.brand p { margin: 6px 0 0; color: var(--paper-dim); font-size: 0.9rem; text-wrap: balance; }
body.playing .mark { width: 30px; height: 44px; font-size: 1.6rem; }
body.playing h1 { font-size: 1.5rem; }
body.playing .brand p { display: none; }
body.playing .lookup, body.playing .settings, body.playing .tip { display: none; }

.field-label { display: block; margin-bottom: 8px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--paper-dim); }

.tile { display: flex; height: 68px; border: 2px solid var(--paper); border-radius: 14px; overflow: hidden; }
.tile:focus-within { border-color: var(--blue); }
.tile input {
  flex: 1; min-width: 0; width: 100%;
  background: transparent; border: 0; border-radius: 0; color: var(--paper);
  font: 700 2.2rem/1 var(--font-mono); text-align: center; letter-spacing: 0.05em;
  padding: 0 8px;
}
.tile input::placeholder { color: var(--line); }
.tile input:focus-visible { outline: none; background: var(--ink-2); }
.tile button {
  flex: none; border: 0; border-radius: 0;
  background: var(--blue); color: #ffffff;
  font: 600 1.05rem var(--font-body); padding: 0 22px; cursor: pointer;
}
.tile button:hover { background: var(--blue-hover); }
.tile button:focus-visible { outline: 3px solid #ffffff; outline-offset: -5px; }
.err { margin: 8px 0 0; color: var(--red-soft); font-size: 0.95rem; }

.settings { display: flex; flex-direction: column; gap: 10px; }
.settings .field-label { margin: 0; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.seg label { position: relative; display: block; }
.seg input, .snd input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg span {
  display: grid; place-items: center; min-height: 48px; border-radius: 12px;
  border: 1.5px solid var(--line); color: var(--paper-dim); font-size: 1rem; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.seg input:checked + span { background: var(--blue); border-color: var(--blue); color: #ffffff; font-weight: 600; }
.seg input:focus-visible + span, .snd input:focus-visible + span { outline: 2px solid var(--paper); outline-offset: 2px; }
.snd { position: relative; display: block; }
.snd span { display: flex; align-items: center; gap: 12px; min-height: 48px; color: var(--paper-dim); font-size: 1rem; cursor: pointer; }
.snd span::before { content: ""; flex: none; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--paper-dim); background: transparent; }
.snd input:checked + span::before { background: var(--blue); border-color: var(--blue); box-shadow: inset 0 0 0 3px var(--ink); }

.card { border-radius: 16px; padding: 22px 20px 24px; }
.card.idle {
  background: var(--ink-2); border: 1.5px dashed var(--line);
  text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-block: 36px;
}
.card.idle .big { font: 800 5.5rem/1 var(--font-display); color: var(--red); }
.card.idle p { margin: 0; color: var(--paper-dim); max-width: 30ch; }
.card.face { background: var(--paper); color: var(--paper-ink); display: flex; flex-direction: column; gap: 20px; }
.face-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.face-id { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.num { font: 700 1.1rem var(--font-mono); letter-spacing: 0.04em; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 10px; border-radius: 999px; background: #eef1f9; border: 1.5px solid var(--paper-track); font-size: 0.85rem; font-weight: 600; color: var(--paper-ink-2); }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
.swap { flex: none; border: 0; background: transparent; color: var(--blue-hover); font: 600 0.95rem var(--font-body); padding: 14px 4px; margin: -14px -4px -14px auto; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.swap:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; border-radius: 4px; }
.question { margin: 0; font: 600 clamp(1.5rem, 6.8vw, 2rem)/1.2 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; overflow-wrap: anywhere; }

.timer { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px; }
.digits { font: 700 3.8rem/1 var(--font-mono); font-variant-numeric: tabular-nums; min-width: 2.3ch; text-align: right; }
.digits small { font-size: 1.2rem; margin-left: 2px; color: var(--paper-ink-2); }
.digits.low { color: var(--red-deep); }
.bar { height: 12px; border-radius: 999px; background: var(--paper-track); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--red); transform-origin: left center; border-radius: 999px; }
@media (prefers-reduced-motion: no-preference) {
  .digits.low { animation: pulse 1s ease-in-out infinite; }
  .answer { animation: rise 0.35s ease-out; }
}
@keyframes pulse { 50% { opacity: 0.55; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

.answer { background: var(--blue); color: #ffffff; border-radius: 12px; padding: 16px 18px; }
.answer-label { margin: 0 0 4px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue-soft); }
.answer-text { margin: 0; font: 800 clamp(1.6rem, 7vw, 2.1rem)/1.15 var(--font-display); overflow-wrap: anywhere; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--ink); border-top: 1px solid var(--line);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.dock-in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
.btn {
  flex: 1 1 0; min-height: 56px; padding: 0 16px; border-radius: 14px; cursor: pointer;
  font: 600 1.05rem var(--font-body); border: 2px solid var(--paper); background: transparent; color: var(--paper);
}
.btn:hover { background: var(--ink-2); }
.btn.solid { background: var(--blue); border-color: var(--blue); color: #ffffff; }
.btn.solid:hover { background: var(--blue-hover); border-color: var(--blue-hover); }
.btn.wide { flex: 1.7 1 0; }
.btn:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
.btn:active, .tile button:active { transform: scale(0.98); }

.tip { margin: 0; color: var(--paper-dim); font-size: 0.88rem; }

@media (min-width: 600px) {
  body { padding-top: max(40px, env(safe-area-inset-top, 0px)); }
  .app { gap: 24px; }
}
</style>
</head>
<body>
<main class="app">
  <header class="brand">
    <div class="mark" aria-hidden="true">?</div>
    <div>
      <h1>DominoQuiz</h1>
      <p>Dominó + conhecimentos gerais. Fichas de 1 a <span id="total">30</span>.</p>
    </div>
    <button type="button" class="swap" id="swapBtn" hidden>Trocar ficha</button>
  </header>

  <form id="lookup" class="lookup" novalidate>
    <label class="field-label" for="num">Número da ficha</label>
    <div class="tile">
      <input id="num" type="text" inputmode="numeric" enterkeyhint="go" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="00" aria-describedby="err">
      <button type="submit">Abrir ficha</button>
    </div>
    <p class="err" id="err" role="alert" hidden></p>
  </form>

  <div class="settings" id="settings">
    <span class="field-label" id="durLabel">Tempo para responder</span>
    <div class="seg" role="radiogroup" aria-labelledby="durLabel">
      <label><input type="radio" name="dur" value="20"><span>20 s</span></label>
      <label><input type="radio" name="dur" value="30" checked><span>30 s</span></label>
      <label><input type="radio" name="dur" value="45"><span>45 s</span></label>
      <label><input type="radio" name="dur" value="60"><span>60 s</span></label>
    </div>
    <label class="snd"><input type="checkbox" id="feedback" checked><span>Som e vibração no fim</span></label>
  </div>

  <section aria-label="Ficha">
    <div id="idle" class="card idle">
      <div class="big" aria-hidden="true">?</div>
      <p>Digite o número que está na ficha para ver a pergunta. O tempo começa na hora.</p>
    </div>

    <article id="face" class="card face" hidden>
      <div class="face-top">
        <div class="face-id">
          <span class="num" id="cardNum">Ficha 01</span>
          <span class="chip"><i></i><span id="chipText"></span></span>
        </div>
      </div>
      <p class="question" id="question"></p>
      <div class="timer">
        <div class="digits" id="digits" aria-hidden="true"><span id="digitsNum">30</span><small>s</small></div>
        <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
      </div>
      <div class="answer" id="answerBox" hidden>
        <p class="answer-label" id="answerLabel">Resposta</p>
        <p class="answer-text" id="answerText"></p>
      </div>
    </article>
  </section>

  <p class="tip">Quem opera a tela é o jogador da esquerda. Quem responde não olha o celular.</p>
  <p class="sr-only" id="live" aria-live="polite"></p>
</main>

<div class="dock" id="controls" hidden>
  <div class="dock-in">
    <button type="button" class="btn" id="pauseBtn">Pausar</button>
    <button type="button" class="btn solid wide" id="revealBtn">Mostrar resposta</button>
    <button type="button" class="btn solid" id="nextBtn" hidden>Nova ficha</button>
  </div>
</div>

<script>
(function () {
  var QUESTIONS = [
    { cat: 'Geografia', q: 'Qual é a capital da Austrália?', a: 'Canberra' },
    { cat: 'Ciência', q: 'Qual planeta é conhecido como Planeta Vermelho?', a: 'Marte' },
    { cat: 'História', q: 'Em que ano o Brasil declarou a independência?', a: '1822' },
    { cat: 'Geografia', q: 'Qual é o maior rio do mundo em volume de água?', a: 'Rio Amazonas' },
    { cat: 'Ciência', q: 'Qual é o símbolo químico do ouro?', a: 'Au' },
    { cat: 'Arte', q: 'Quem pintou a Mona Lisa?', a: 'Leonardo da Vinci' },
    { cat: 'Esportes', q: 'Quantos jogadores de cada time ficam em quadra no vôlei?', a: '6 jogadores' },
    { cat: 'História', q: 'Quem foi o primeiro presidente do Brasil?', a: 'Marechal Deodoro da Fonseca' },
    { cat: 'Ciência', q: 'Quantos ossos tem o corpo de um adulto?', a: '206' },
    { cat: 'Geografia', q: 'Qual é o menor país do mundo em área?', a: 'Vaticano' },
    { cat: 'Curiosidades', q: 'Quantos lados tem um hexágono?', a: '6 lados' },
    { cat: 'Geografia', q: 'Qual é o maior oceano do planeta?', a: 'Oceano Pacífico' },
    { cat: 'Arte', q: 'Quem escreveu o romance Dom Casmurro?', a: 'Machado de Assis' },
    { cat: 'Esportes', q: 'Em que país foi disputada a Copa do Mundo de 2014?', a: 'Brasil' },
    { cat: 'Ciência', q: 'Qual gás as plantas absorvem durante a fotossíntese?', a: 'Gás carbônico (CO₂)' },
    { cat: 'História', q: 'Em que ano o ser humano pisou na Lua pela primeira vez?', a: '1969' },
    { cat: 'Geografia', q: 'Qual é o maior país do mundo em área?', a: 'Rússia' },
    { cat: 'Curiosidades', q: 'Quantas cores tem o arco-íris?', a: '7 cores' },
    { cat: 'Ciência', q: 'Qual é o animal terrestre mais rápido do mundo?', a: 'Guepardo (chita)' },
    { cat: 'Arte', q: 'Qual instrumento tem 88 teclas brancas e pretas no formato padrão?', a: 'Piano' },
    { cat: 'História', q: 'Qual civilização construiu a cidade de Machu Picchu?', a: 'Os incas' },
    { cat: 'Geografia', q: 'Qual é a capital do Canadá?', a: 'Ottawa' },
    { cat: 'Esportes', q: 'De quantos em quantos anos acontece a Copa do Mundo de futebol masculino?', a: 'A cada 4 anos' },
    { cat: 'Ciência', q: 'Qual é o elemento químico mais abundante do universo?', a: 'Hidrogênio' },
    { cat: 'Curiosidades', q: 'Quantas peças tem um jogo de dominó tradicional?', a: '28 peças' },
    { cat: 'Geografia', q: 'Qual é o ponto mais alto do Brasil?', a: 'Pico da Neblina' },
    { cat: 'História', q: 'Em qual país nasceram os Jogos Olímpicos da Antiguidade?', a: 'Grécia' },
    { cat: 'Ciência', q: 'Qual órgão do corpo humano bombeia o sangue?', a: 'O coração' },
    { cat: 'Arte', q: 'Qual compositor escreveu a Nona Sinfonia, que termina com a Ode à Alegria?', a: 'Ludwig van Beethoven' },
    { cat: 'Curiosidades', q: 'Quantos dias tem um ano bissexto?', a: '366 dias' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var duration = 30;
  var feedbackOn = true;
  try {
    var d = parseInt(localStorage.getItem('dq-duration'), 10);
    if ([20, 30, 45, 60].indexOf(d) > -1) duration = d;
    if (localStorage.getItem('dq-feedback') === '0') feedbackOn = false;
  } catch (e) {}

  var st = { mode: 'idle', total: 0, endAt: 0, left: 0, timer: null, idx: 0 };
  var actx = null;
  var wake = null;

  $('total').textContent = QUESTIONS.length;
  $('feedback').checked = feedbackOn;
  Array.prototype.forEach.call(document.querySelectorAll('input[name="dur"]'), function (r) {
    r.checked = (parseInt(r.value, 10) === duration);
    r.addEventListener('change', function () {
      duration = parseInt(r.value, 10);
      try { localStorage.setItem('dq-duration', String(duration)); } catch (e) {}
    });
  });
  $('feedback').addEventListener('change', function () {
    feedbackOn = $('feedback').checked;
    try { localStorage.setItem('dq-feedback', feedbackOn ? '1' : '0'); } catch (e) {}
  });

  function showError(msg) { $('err').textContent = msg; $('err').hidden = false; }
  function clearError() { $('err').hidden = true; }
  function setPlaying(on) { document.body.classList.toggle('playing', on); }

  function unlockAudio() {
    if (!feedbackOn) return;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      if (!actx) actx = new C();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }

  function keepAwake(on) {
    try {
      if (on) {
        if ('wakeLock' in navigator && !wake) {
          navigator.wakeLock.request('screen').then(function (lock) {
            wake = lock;
            lock.addEventListener('release', function () { wake = null; });
          }).catch(function () {});
        }
      } else if (wake) {
        wake.release().catch(function () {});
        wake = null;
      }
    } catch (e) {}
  }

  function alertEnd() {
    if (!feedbackOn) return;
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    try {
      if (!actx) return;
      [0, 0.3].forEach(function (t) {
        var o = actx.createOscillator();
        var g = actx.createGain();
        o.frequency.value = 660;
        o.connect(g);
        g.connect(actx.destination);
        var s = actx.currentTime + t;
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(0.25, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, s + 0.22);
        o.start(s);
        o.stop(s + 0.25);
      });
    } catch (e) {}
  }

  function paint(leftMs) {
    var secs = Math.ceil(leftMs / 1000);
    $('digitsNum').textContent = secs;
    $('barFill').style.transform = 'scaleX(' + Math.max(0, leftMs / st.total) + ')';
    $('digits').classList.toggle('low', secs <= 5 && secs > 0);
  }

  function stopTimer() {
    if (st.timer) { clearInterval(st.timer); st.timer = null; }
  }

  function tick() {
    var left = Math.max(0, st.endAt - performance.now());
    paint(left);
    if (left <= 0) finish('time');
  }

  function finish(reason) {
    stopTimer();
    var item = QUESTIONS[st.idx];
    st.mode = 'done';
    $('digits').classList.remove('low');
    if (reason === 'time') paint(0);
    $('answerLabel').textContent = reason === 'time' ? 'Tempo esgotado. A resposta é' : 'A resposta é';
    $('answerText').textContent = item.a;
    $('answerBox').hidden = false;
    $('pauseBtn').hidden = true;
    $('revealBtn').hidden = true;
    $('nextBtn').hidden = false;
    $('swapBtn').hidden = true;
    keepAwake(false);
    $('live').textContent = (reason === 'time' ? 'Tempo esgotado. ' : '') + 'Resposta: ' + item.a;
    if (reason === 'time') alertEnd();
    window.scrollTo(0, 0);
  }

  function openCard(n) {
    stopTimer();
    var item = QUESTIONS[n - 1];
    st.idx = n - 1;
    st.total = duration * 1000;
    st.endAt = performance.now() + st.total;
    st.mode = 'running';
    $('cardNum').textContent = 'Ficha ' + (n < 10 ? '0' + n : n);
    $('chipText').textContent = item.cat;
    $('question').textContent = item.q;
    $('answerBox').hidden = true;
    $('idle').hidden = true;
    $('face').hidden = false;
    $('controls').hidden = false;
    $('pauseBtn').hidden = false;
    $('pauseBtn').textContent = 'Pausar';
    $('revealBtn').hidden = false;
    $('nextBtn').hidden = true;
    $('swapBtn').hidden = false;
    setPlaying(true);
    keepAwake(true);
    $('live').textContent = 'Ficha ' + n + ', ' + item.cat + '. ' + item.q;
    paint(st.total);
    window.scrollTo(0, 0);
    st.timer = setInterval(tick, 100);
  }

  function reset() {
    stopTimer();
    st.mode = 'idle';
    $('face').hidden = true;
    $('idle').hidden = false;
    $('controls').hidden = true;
    $('swapBtn').hidden = true;
    setPlaying(false);
    keepAwake(false);
    clearError();
    $('num').value = '';
    window.scrollTo(0, 0);
    $('num').focus();
  }

  $('lookup').addEventListener('submit', function (e) {
    e.preventDefault();
    var raw = $('num').value.trim();
    var n = parseInt(raw, 10);
    if (!raw || isNaN(n) || n < 1 || n > QUESTIONS.length) {
      showError('Digite um número de 1 a ' + QUESTIONS.length + '.');
      return;
    }
    clearError();
    unlockAudio();
    openCard(n);
    $('num').blur();
  });

  $('num').addEventListener('input', function () {
    $('num').value = $('num').value.replace(/\D/g, '');
    clearError();
  });

  $('pauseBtn').addEventListener('click', function () {
    if (st.mode === 'running') {
      st.left = Math.max(0, st.endAt - performance.now());
      stopTimer();
      st.mode = 'paused';
      $('pauseBtn').textContent = 'Continuar';
    } else if (st.mode === 'paused') {
      st.endAt = performance.now() + st.left;
      st.mode = 'running';
      $('pauseBtn').textContent = 'Pausar';
      st.timer = setInterval(tick, 100);
    }
  });

  $('revealBtn').addEventListener('click', function () { finish('manual'); });
  $('nextBtn').addEventListener('click', reset);
  $('swapBtn').addEventListener('click', reset);
})();
</script>
</body>
</html>
